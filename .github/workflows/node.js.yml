name: Testing CI Pipeline
on:
  push:
    branches: [ "main", "dev" ]

jobs:
  build-frontend:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [macOS-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v3
        with:
          node-version: '18'
      - name: Install and Build Frontend
        working-directory: ./frontend
        run: |
          npm ci
          npm run build

  build-backend:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [macOS-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v3
        with:
          node-version: '18'
      - name: Install and Build Backend
        working-directory: ./backend
        run: |
          npm ci
      - name: Run tests
        working-directory: ./backend
        run: npm test -- --coverage --runInBand
